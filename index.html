<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antarctica Excursion Gallery</title>
<style>
  @font-face { font-family: 'Akkurat'; src: url('font/Akkurat-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; }
  @font-face { font-family: 'Akkurat'; src: url('font/Akkurat.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Akkurat'; src: url('font/Akkurat-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }

  :root{
    --pink:#f6c9d3;
    --pink-text:#3a2a2c;
    --gap:10px;
    --radius:4px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; font-family:'Akkurat', Arial, Helvetica, sans-serif; }

  .gallery-wrap{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:20px;
  }

  .gallery-grid{
    display:grid;
    grid-template-columns: 1.8fr 1fr 1.6fr 2fr;
    grid-template-rows: repeat(3, minmax(140px, 1fr));
    gap:var(--gap);
    width:100%;
    aspect-ratio: 984 / 661;
  }

  .tile{
    position:relative;
    overflow:hidden;
    border-radius:var(--radius);
    background-size:cover;
    background-position:center;
    isolation:isolate;
    cursor:pointer;
  }
  .tile img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s cubic-bezier(.16,1,.3,1);
  }
  .tile:hover img{ transform:scale(1.06); }

  /* placeholder art (swap for real photos: replace .tile-fill divs with <img>) */
  .tile-fill{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .6s cubic-bezier(.16,1,.3,1);
  }
  .tile:hover .tile-fill{ transform:scale(1.06); }
  .tile-fill svg{ width:34%; height:34%; opacity:.85; }
  .tile-fill::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 100%);
    transition:background .4s ease;
    pointer-events:none;
  }
  .tile:hover .tile-fill::after{
    background:linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,.05) 55%, rgba(0,0,0,0) 100%);
  }

  .t1 .tile-fill{ background:linear-gradient(160deg,#1c3a4a,#0c1c26); }
  .t2 .tile-fill{ background:linear-gradient(160deg,#2f6f8f,#123244); }
  .t3 .tile-fill{ background:linear-gradient(160deg,#123246,#050d12); }
  .t4 .tile-fill{ background:linear-gradient(160deg,#3d7c93,#0e2733); }
  .t5 .tile-fill{ background:linear-gradient(160deg,#264a55,#0a171d); }
  .t6 .tile-fill{ background:linear-gradient(160deg,#5c6b6f,#1a2528); }

  .tag{
    position:absolute;
    left:14px;
    bottom:14px;
    z-index:2;
    background:transparent;
    color:#fff;
    font-size:16px;
    font-weight:400;
    line-height:1.3;
    padding:0;
    max-width:calc(100% - 28px);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .35s ease, transform .35s cubic-bezier(.16,1,.3,1);
    pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .tile:hover .tag,
  .tile:focus-visible .tag{
    opacity:1;
    transform:translateY(0);
  }
  .tile:focus-visible{ outline:2px solid #fff; outline-offset:-2px; }

  .tag-nowrap{ white-space:nowrap; }

  .t1{ grid-column:1 / 2; grid-row:1 / 2; }
  .t2{ grid-column:2 / 4; grid-row:1 / 2; }
  .t3{ grid-column:4 / 5; grid-row:1 / 3; }
  .t4{ grid-column:1 / 3; grid-row:2 / 4; }
  .t5{ grid-column:3 / 4; grid-row:2 / 3; }
  .t6{ grid-column:3 / 5; grid-row:3 / 4; }

  @media (max-width:760px){
    .gallery-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: none;
      aspect-ratio:auto;
    }
    .tile{ aspect-ratio: 1 / 1; }
    .t1,.t2,.t3,.t4,.t5,.t6{ grid-column:auto; grid-row:auto; }

    /* no hover on touch: keep captions visible */
    .tag{
      opacity:1;
      transform:none;
      font-size:14px;
    }
    .tag-nowrap{ white-space:normal; font-size:14px; }
    .tile-fill::after{
      background:linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.05) 55%, rgba(0,0,0,0) 100%);
    }
  }
</style>
</head>
<body>

<div class="gallery-wrap">

  <div class="gallery-grid">

    <div class="tile t1" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><path d="M6 28h40l10 6H10z"/><path d="M46 28V14"/><path d="M20 34l-6 14"/><path d="M40 34l6 14"/><circle cx="46" cy="12" r="2" fill="#eef4f6"/></svg>
      </div>
      <div class="tag">Helicopter Experience</div>
    </div>

    <div class="tile t2" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><circle cx="32" cy="28" r="16"/><path d="M32 4v6M14 28H4M60 28H50"/><path d="M20 44h24l6 10H14z"/></svg>
      </div>
      <div class="tag">Scenic Neptune</div>
    </div>

    <div class="tile t3" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><path d="M12 46c6-4 10-4 16 0s10 4 16 0 8-3 8-3"/><path d="M8 52c6-4 10-4 16 0s10 4 16 0 8-3 8-3"/><ellipse cx="32" cy="26" rx="14" ry="9"/></svg>
      </div>
      <div class="tag">Enriching Discovery</div>
    </div>

    <div class="tile t4" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><path d="M6 40c8 8 44 8 52 0"/><path d="M14 40V26h24l8 14"/><path d="M50 26l-4-8"/></svg>
      </div>
      <div class="tag">Zodiac Excursion, Fournicer Bay, Antarctica</div>
    </div>

    <div class="tile t5" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><path d="M8 46l12-18 8 6 10-16 18 28z"/><circle cx="46" cy="14" r="4"/></svg>
      </div>
      <div class="tag">Excursion Experience</div>
    </div>

    <div class="tile t6" tabindex="0">
      <div class="tile-fill">
        <svg viewBox="0 0 64 64" fill="none" stroke="#eef4f6" stroke-width="1.6"><ellipse cx="24" cy="34" rx="9" ry="14"/><ellipse cx="44" cy="38" rx="7" ry="11"/><path d="M24 48v6M44 49v5"/></svg>
      </div>
      <div class="tag tag-nowrap">Emperor penguins, Snow Hill Island</div>
    </div>

  </div>
</div>

</body>
</html>
